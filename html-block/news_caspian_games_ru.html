<!-- Yessenov University · Caspian Games 2026 · блок новостей (RU)
     Вставка: Custom HTML блок. Новости по ярлыку «kaspijskie-igry» (тег, если нет — рубрика).
     Настройки у <section>: data-count="6" · data-slug="..." · data-api="/?rest_route=/wp/v2/" (если нет «красивых» ссылок) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<style>
.yucgn{--n:#0b2a5b;--b:#0b3d91;--a:#00aaff;--g:#f59e0b;--l:#f0f5fb;--t:#1a2a3a;--m:#64748b;--d:#94a3b8;--bd:#dde6f0;
  --ease:cubic-bezier(.4,0,.2,1);--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif!important;
  color:var(--t);background:#fff;padding:96px 6%;line-height:1.7;-webkit-font-smoothing:antialiased}
.yucgn *,.yucgn *::before,.yucgn *::after{box-sizing:border-box}
.yucgn-wrap{max-width:1240px;margin:0 auto}

/* ===== Section head: eyebrow + title + sub ===== */
.yucgn-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px 40px;margin-bottom:48px}
.yucgn-eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono)!important;font-size:11px!important;font-weight:700!important;
  color:var(--a)!important;letter-spacing:.15em;text-transform:uppercase;padding:7px 16px;border:1px solid rgba(0,170,255,.3);border-radius:30px;margin:0 0 18px}
.yucgn-eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--a)}
.yucgn-title{font-family:inherit!important;font-size:clamp(28px,4vw,48px)!important;font-weight:900!important;line-height:1.08!important;
  letter-spacing:-.02em!important;color:var(--n)!important;margin:0 0 14px!important;padding:0!important;text-transform:none!important}
.yucgn-sub{font-size:16px;color:var(--m);max-width:520px;line-height:1.75;margin:0!important}
.yucgn-sub b{color:var(--g);font-weight:700}
.yucgn-actions{display:flex;flex-wrap:wrap;gap:14px}

.yucgn-btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono)!important;font-size:13px!important;font-weight:700!important;
  line-height:1.2!important;padding:14px 32px;border-radius:8px;text-decoration:none!important;transition:all .3s var(--ease);white-space:nowrap}
.yucgn-btn--primary{background:var(--n)!important;color:#fff!important;border:1.5px solid var(--n)}
.yucgn-btn--primary:hover{background:var(--b)!important;border-color:var(--b);transform:translateY(-2px);box-shadow:0 12px 30px rgba(11,42,91,.2)}
.yucgn-btn--outline{background:transparent!important;color:var(--n)!important;border:1.5px solid var(--n)}
.yucgn-btn--outline:hover{background:var(--l)!important}
.yucgn-btn[hidden]{display:none!important}

/* ===== Grid ===== */
.yucgn-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.yucgn-card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--bd);border-radius:16px;overflow:hidden;
  box-shadow:0 4px 12px rgba(11,42,91,.04);transition:all .3s var(--ease)}
.yucgn-card:hover{transform:translateY(-6px);box-shadow:0 20px 40px rgba(11,42,91,.16);border-color:var(--a)}
.yucgn-media{position:relative;display:block;aspect-ratio:16/10;overflow:hidden;background:linear-gradient(135deg,var(--n),var(--b));text-decoration:none!important}
.yucgn-media img{display:block!important;width:100%!important;height:100%!important;max-width:none!important;object-fit:cover;object-position:center;
  margin:0!important;border-radius:0!important;transition:transform .6s var(--ease)}
.yucgn-card:hover .yucgn-media img{transform:scale(1.05)}
.yucgn-ph{display:grid;place-items:center;height:100%}
.yucgn-ph img{width:96px!important;height:auto!important;object-fit:contain;filter:brightness(0) invert(1);opacity:.9}
.yucgn-tag{position:absolute;left:16px;top:16px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:#fff;background:rgba(11,42,91,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:5px 10px;border-radius:4px}

.yucgn-body{display:flex;flex-direction:column;gap:12px;padding:24px 26px 28px;flex:1}
.yucgn-date{align-self:flex-start;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--n);
  background:var(--l);border:1px solid var(--bd);border-radius:6px;padding:4px 10px}
.yucgn-card h3{font-family:inherit!important;font-size:18px!important;font-weight:800!important;line-height:1.35!important;margin:0!important;padding:0!important;letter-spacing:normal!important}
.yucgn-card h3 a{color:var(--n)!important;text-decoration:none!important;transition:color .3s var(--ease)}
.yucgn-card h3 a:hover{color:var(--a)!important}
.yucgn-excerpt{font-size:14px;line-height:1.7;color:var(--m);margin:0!important}
.yucgn-more{margin-top:auto;padding-top:6px;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--a)!important;text-decoration:none!important;letter-spacing:.04em}
.yucgn-more:hover{color:var(--n)!important}

.yucgn-empty{padding:40px 24px;text-align:center;border:1px dashed var(--bd);border-radius:16px;color:var(--m);background:var(--l);margin:0}

.yucgn-skel{min-height:380px;border:1px solid var(--bd);border-radius:16px;
  background:linear-gradient(90deg,var(--l) 25%,#f8fbfe 50%,var(--l) 75%);background-size:200% 100%;animation:yucgn-sh 1.2s infinite}
@keyframes yucgn-sh{to{background-position:-200% 0}}

/* ===== Responsive ===== */
@media (max-width:900px){.yucgn-grid{grid-template-columns:repeat(2,1fr);gap:20px}}
@media (max-width:768px){.yucgn-grid{grid-template-columns:1fr}.yucgn-skel:nth-child(n+2){display:none}}
@media (max-width:600px){.yucgn{padding:72px 5%}.yucgn-head{margin-bottom:32px}.yucgn-actions{width:100%}.yucgn-btn{flex:1;justify-content:center;padding:14px 18px}}
@media (prefers-reduced-motion:reduce){.yucgn *{transition:none!important;animation:none!important}}
</style>

<section class="yucgn" id="yucgn-ru" data-slug="kaspijskie-igry" data-count="6">
  <div class="yucgn-wrap">
    <header class="yucgn-head">
      <div>
        <p class="yucgn-eyebrow">VIII Международные студенческие игры</p>
        <h2 class="yucgn-title">Каспийские игры – 2026</h2>
        <p class="yucgn-sub"><b>5–9 октября · Актау.</b> Студенты Прикаспийских стран соревнуются в 10 видах спорта. Последние новости Игр.</p>
      </div>
      <div class="yucgn-actions">
        <a class="yucgn-btn yucgn-btn--outline" href="#" hidden>Все новости</a>
        <a class="yucgn-btn yucgn-btn--primary" href="https://sport.yu.edu.kz/?lang=ru" target="_blank" rel="noopener">Сайт игр →</a>
      </div>
    </header>
    <div class="yucgn-grid">
      <div class="yucgn-skel"></div><div class="yucgn-skel"></div><div class="yucgn-skel"></div>
    </div>
  </div>
</section>

<script>
(function () {
  var root = document.getElementById("yucgn-ru");
  if (!root) return;
  var API = root.getAttribute("data-api") || "/wp-json/wp/v2/";
  var COUNT = parseInt(root.getAttribute("data-count"), 10) || 6;
  var SLUG = root.getAttribute("data-slug");
  var T = {"locale": "ru-RU", "read": "Подробнее →", "tag": "Caspian Games", "empty": "Новостей пока нет.", "error": "Не удалось загрузить новости."};
  var LOGO = "https://global.yu.edu.kz/wp-content/uploads/2026/02/blue_logo.png";

  var grid = root.querySelector(".yucgn-grid");
  var moreBtn = root.querySelector(".yucgn-btn--outline");

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function text(html) {
    var d = document.createElement("div");
    d.innerHTML = html || "";
    return (d.textContent || "").replace(/\s+/g, " ").trim();
  }
  function trimWords(s, n) {
    var w = s.split(" ");
    return w.length > n ? w.slice(0, n).join(" ") + "…" : s;
  }
  function fmtDate(iso) {
    try { return new Date(iso).toLocaleDateString(T.locale, { day: "numeric", month: "long", year: "numeric" }); }
    catch (e) { return iso.slice(0, 10); }
  }
  function getJSON(url) {
    return fetch(url, { credentials: "same-origin" }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    });
  }
  function api(path) {
    return API + path.replace("?", API.indexOf("?") === -1 ? "?" : "&");
  }
  function message(msg) {
    grid.outerHTML = '<p class="yucgn-empty">' + esc(msg) + "</p>";
  }

  getJSON(api("tags?slug=" + encodeURIComponent(SLUG)))
    .then(function (tags) {
      if (tags.length) return { tax: "tags", term: tags[0] };
      return getJSON(api("categories?slug=" + encodeURIComponent(SLUG))).then(function (cats) {
        return cats.length ? { tax: "categories", term: cats[0] } : null;
      });
    })
    .then(function (found) {
      if (!found) return [];
      moreBtn.href = found.term.link;
      moreBtn.hidden = false;
      return getJSON(api("posts?" + found.tax + "=" + found.term.id + "&per_page=" + COUNT + "&_embed=wp:featuredmedia"));
    })
    .then(function (posts) {
      if (!posts.length) return message(T.empty);
      grid.innerHTML = posts.map(function (p) {
        var m = p._embedded && p._embedded["wp:featuredmedia"] && p._embedded["wp:featuredmedia"][0];
        var img;
        if (m && m.source_url) {
          var s = (m.media_details && m.media_details.sizes) || {};
          var src = (s.medium_large || s.large || s.medium || {}).source_url || m.source_url;
          img = '<img src="' + esc(src) + '" alt="" loading="lazy">';
        } else {
          img = '<span class="yucgn-ph"><img src="' + LOGO + '" alt=""></span>';
        }
        return '<article class="yucgn-card">' +
          '<a class="yucgn-media" href="' + esc(p.link) + '" tabindex="-1" aria-hidden="true">' + img +
            '<span class="yucgn-tag">' + esc(T.tag) + "</span></a>" +
          '<div class="yucgn-body">' +
            '<time class="yucgn-date" datetime="' + esc(p.date) + '">' + esc(fmtDate(p.date)) + "</time>" +
            '<h3><a href="' + esc(p.link) + '">' + esc(text(p.title && p.title.rendered)) + "</a></h3>" +
            '<p class="yucgn-excerpt">' + esc(trimWords(text(p.excerpt && p.excerpt.rendered), 20)) + "</p>" +
            '<a class="yucgn-more" href="' + esc(p.link) + '">' + esc(T.read) + "</a>" +
          "</div></article>";
      }).join("");
    })
    .catch(function () { message(T.error); });
})();
</script>
