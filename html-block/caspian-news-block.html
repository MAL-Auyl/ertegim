<!-- ===== Caspian Games 2026 — блок новостей. Вставлять в блок «Произвольный HTML». ===== -->
<!--
  Язык (kk / ru / en) определяется по языку страницы, и под него берётся ярлык:
    kk → kaspij-ojyndary · ru → kaspijskie-igry · en → caspian-games
  Сначала ищется тег с этим ярлыком, если его нет — рубрика.

  Необязательные настройки (атрибуты у <div id="caspian-news">):
    data-lang="ru"            — принудительно выбрать язык
    data-slug="..."           — другой ярлык тега/рубрики
    data-count="3"            — сколько новостей (по умолчанию 6)
    data-api="/?rest_route=/wp/v2/"  — если на сайте отключены «красивые» ссылки
-->
<style>
.cgn {
  --cgn-navy-900: #070f4f;
  --cgn-navy-700: #1226a8;
  --cgn-navy-600: #1d36c9;
  --cgn-cyan: #3fe6f2;
  --cgn-lime: #e4f53a;
  --cgn-ink: #0f1d5e;
  --cgn-muted: #5b6796;
  --cgn-line: #dfe5fb;
  --cgn-radius: 16px;

  margin: 40px 0;
  font-family: inherit;
  color: var(--cgn-ink);
}
.cgn *,
.cgn *::before,
.cgn *::after { box-sizing: border-box; }

/* ===== Heading banner ===== */
.cgn-head {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  padding: 32px 36px;
  border-radius: var(--cgn-radius);
  color: #fff;
  background:
    radial-gradient(ellipse at 85% 0%, rgba(63, 230, 242, 0.3), transparent 55%),
    linear-gradient(120deg, var(--cgn-navy-700), var(--cgn-navy-900));
}
.cgn-head::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--cgn-cyan), var(--cgn-lime));
}
.cgn-head__eyebrow {
  margin: 0;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--cgn-cyan);
}
.cgn-head__title {
  margin: 6px 0 8px;
  font-size: clamp(26px, 4vw, 40px);
  font-weight: 900;
  line-height: 1.1;
  text-transform: uppercase;
  color: #fff;
}
.cgn-head__dates {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  color: var(--cgn-lime);
}
.cgn-head__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.cgn-btn {
  display: inline-block;
  padding: 11px 20px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 800;
  line-height: 1.2;
  text-decoration: none !important;
  background: var(--cgn-lime);
  color: var(--cgn-navy-900) !important;
  transition: transform 0.2s, box-shadow 0.2s;
}
.cgn-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(228, 245, 58, 0.3);
}
.cgn-btn--ghost {
  background: transparent;
  color: #fff !important;
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.4);
}
.cgn-btn--ghost:hover {
  box-shadow: inset 0 0 0 2px var(--cgn-cyan);
}

/* ===== News grid ===== */
.cgn-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-top: 24px;
}
.cgn-card {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #fff;
  border: 1px solid var(--cgn-line);
  border-radius: var(--cgn-radius);
  transition: transform 0.2s, box-shadow 0.2s;
}
.cgn-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 28px rgba(10, 25, 120, 0.12);
}
.cgn-card__media {
  display: block;
  text-decoration: none !important;
  aspect-ratio: 16 / 10;
  overflow: hidden;
  background: var(--cgn-navy-700);
}
.cgn-card__media img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s;
}
.cgn-card:hover .cgn-card__media img { transform: scale(1.04); }
.cgn-card__placeholder {
  display: grid;
  place-items: center;
  height: 100%;
  font-size: 40px;
  font-weight: 900;
  color: var(--cgn-cyan);
}
.cgn-card__body {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 18px 20px 22px;
}
.cgn-card__date {
  font-size: 13px;
  font-weight: 700;
  color: var(--cgn-navy-600);
}
.cgn-card__title {
  margin: 0;
  font-size: 17px;
  font-weight: 800;
  line-height: 1.35;
}
.cgn-card__title a {
  color: var(--cgn-ink) !important;
  text-decoration: none !important;
}
.cgn-card__title a:hover { color: var(--cgn-navy-600) !important; }
.cgn-card__excerpt {
  margin: 0;
  font-size: 14px;
  line-height: 1.55;
  color: var(--cgn-muted);
}

.cgn-empty {
  margin: 24px 0 0;
  padding: 24px;
  text-align: center;
  border: 1px dashed var(--cgn-line);
  border-radius: var(--cgn-radius);
  color: var(--cgn-muted);
}

/* ===== Responsive ===== */
@media (max-width: 900px) {
  .cgn-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  .cgn-head { padding: 24px 20px 28px; align-items: flex-start; }
  .cgn-head__actions { width: 100%; }
  .cgn-btn { flex: 1; text-align: center; }
  .cgn-grid { grid-template-columns: 1fr; gap: 14px; }
}

@media (prefers-reduced-motion: reduce) {
  .cgn * { transition: none !important; }
}

.cgn-skel { background: linear-gradient(90deg, #eef2ff 25%, #f7f9ff 50%, #eef2ff 75%); background-size: 200% 100%; animation: cgn-sh 1.2s infinite; }
.cgn-card--skel { min-height: 320px; }
@keyframes cgn-sh { to { background-position: -200% 0; } }
</style>

<section class="cgn" id="caspian-news"></section>

<script>
(function () {
  var root = document.getElementById("caspian-news");
  if (!root) return;

  // ===== Settings (can be changed via data-* attributes on #caspian-news) =====
  var API = root.getAttribute("data-api") || "/wp-json/wp/v2/";
  var COUNT = parseInt(root.getAttribute("data-count"), 10) || 6;
  var FORCE_LANG = root.getAttribute("data-lang") || "";

  var L = {
    kk: {
      slug: "kaspij-ojyndary", locale: "kk-KZ",
      title: "Каспий ойындары – 2026", subtitle: "VIII халықаралық студенттік ойындар",
      dates: "5–9 қазан · Ақтау", more: "Барлық жаңалықтар", site: "Ойындар сайты",
      empty: "Жаңалықтар әзірге жоқ.", error: "Жаңалықтарды жүктеу мүмкін болмады."
    },
    ru: {
      slug: "kaspijskie-igry", locale: "ru-RU",
      title: "Каспийские игры – 2026", subtitle: "VIII Международные студенческие игры",
      dates: "5–9 октября · Актау", more: "Все новости", site: "Сайт игр",
      empty: "Новостей пока нет.", error: "Не удалось загрузить новости."
    },
    en: {
      slug: "caspian-games", locale: "en-GB",
      title: "Caspian Games 2026", subtitle: "VIII International Student Games",
      dates: "October 5–9 · Aktau", more: "All news", site: "Games website",
      empty: "No news yet.", error: "Could not load news."
    }
  };

  function detectLang() {
    if (L[FORCE_LANG]) return FORCE_LANG;
    var h = (document.documentElement.lang || "").toLowerCase().slice(0, 2);
    if (h === "kz") h = "kk";
    if (L[h]) return h;
    var path = location.pathname.split("/")[1];
    if (L[path]) return path;
    return "kk";
  }

  var lang = detectLang();
  var T = L[lang];
  var slug = root.getAttribute("data-slug") || T.slug;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  // WordPress returns HTML in title/excerpt; turn it into plain text.
  function text(html) {
    var d = document.createElement("div");
    d.innerHTML = html || "";
    return (d.textContent || "").replace(/\s+/g, " ").trim();
  }
  function trimWords(s, n) {
    var w = s.split(" ");
    return w.length > n ? w.slice(0, n).join(" ") + "…" : s;
  }
  function fmtDate(iso) {
    try {
      return new Date(iso).toLocaleDateString(T.locale, { day: "numeric", month: "long", year: "numeric" });
    } catch (e) { return iso.slice(0, 10); }
  }
  function getJSON(url) {
    return fetch(url, { credentials: "same-origin" }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    });
  }
  function api(path) {
    // Works with both "/wp-json/wp/v2/" and "/?rest_route=/wp/v2/".
    return API + path.replace("?", API.indexOf("?") === -1 ? "?" : "&");
  }

  // ===== Header =====
  root.innerHTML =
    '<header class="cgn-head"><div class="cgn-head__text">' +
      '<p class="cgn-head__eyebrow">' + esc(T.subtitle) + "</p>" +
      '<h2 class="cgn-head__title">' + esc(T.title) + "</h2>" +
      '<p class="cgn-head__dates">' + esc(T.dates) + "</p>" +
    '</div><div class="cgn-head__actions">' +
      '<a class="cgn-btn cgn-btn--ghost" id="cgn-more" href="#" hidden>' + esc(T.more) + " →</a>" +
      '<a class="cgn-btn" href="https://sport.yu.edu.kz/?lang=' + lang + '" target="_blank" rel="noopener">' + esc(T.site) + "</a>" +
    "</div></header>" +
    '<div class="cgn-grid" id="cgn-grid">' +
      new Array(Math.min(COUNT, 3) + 1).join('<div class="cgn-card cgn-card--skel cgn-skel"></div>') +
    "</div>";

  var grid = root.querySelector("#cgn-grid");
  var more = root.querySelector("#cgn-more");

  function message(msg) {
    grid.outerHTML = '<p class="cgn-empty">' + esc(msg) + "</p>";
  }

  // ===== Find the tag (or category) by slug, then load its posts =====
  getJSON(api("tags?slug=" + encodeURIComponent(slug)))
    .then(function (tags) {
      if (tags.length) return { tax: "tags", term: tags[0] };
      return getJSON(api("categories?slug=" + encodeURIComponent(slug))).then(function (cats) {
        return cats.length ? { tax: "categories", term: cats[0] } : null;
      });
    })
    .then(function (found) {
      if (!found) return [];
      more.href = found.term.link;
      more.hidden = false;
      return getJSON(api("posts?" + found.tax + "=" + found.term.id + "&per_page=" + COUNT + "&_embed=wp:featuredmedia"));
    })
    .then(function (posts) {
      if (!posts.length) return message(T.empty);
      grid.innerHTML = posts.map(function (p) {
        var media = p._embedded && p._embedded["wp:featuredmedia"] && p._embedded["wp:featuredmedia"][0];
        var img = "";
        if (media && media.source_url) {
          var sizes = (media.media_details && media.media_details.sizes) || {};
          var src = (sizes.medium_large || sizes.large || sizes.medium || {}).source_url || media.source_url;
          img = '<img src="' + esc(src) + '" alt="" loading="lazy">';
        } else {
          img = '<span class="cgn-card__placeholder">CG</span>';
        }
        var title = text(p.title && p.title.rendered);
        var excerpt = trimWords(text(p.excerpt && p.excerpt.rendered), 18);
        return '<article class="cgn-card">' +
          '<a class="cgn-card__media" href="' + esc(p.link) + '" tabindex="-1" aria-hidden="true">' + img + "</a>" +
          '<div class="cgn-card__body">' +
            '<time class="cgn-card__date" datetime="' + esc(p.date) + '">' + esc(fmtDate(p.date)) + "</time>" +
            '<h3 class="cgn-card__title"><a href="' + esc(p.link) + '">' + esc(title) + "</a></h3>" +
            '<p class="cgn-card__excerpt">' + esc(excerpt) + "</p>" +
          "</div></article>";
      }).join("");
    })
    .catch(function () { message(T.error); });
})();
</script>
