name: ci
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun test
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse ESM entrypoints
        run: |
          set -e
          for f in server/server.js server/bins.js server/static.js api/transcribe.js lib/blocklist-core.js lib/stt-hints-core.js; do
            cp "$f" /tmp/check.mjs && node --check /tmp/check.mjs && echo "ok $f"
          done
