<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ертегім — выбор голоса</title>
<link rel="stylesheet" href="design-system.css">
<style>
  body { display: flex; flex-direction: column; align-items: center; padding: 48px 20px; }
  .panel { width: 100%; max-width: 520px; padding: var(--space-5); }
  h1 { margin: 0 0 6px; }
  p.sub { color: var(--ink-soft); font-size: 0.9rem; margin: 0 0 24px; }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 4px; border-top: 1px solid var(--line);
  }
  .row:first-of-type { border-top: none; }
  .label { font-weight: 600; }
  .btn-play { padding: 10px 18px; font-size: 0.9rem; }
  .status { text-align: center; margin-top: 16px; color: var(--ink-soft); font-size: 0.85rem; min-height: 1.2em; }
</style>
</head>
<body>
  <div class="panel glass-panel">
    <h1 class="eyebrow">Выбери голос для героев</h1>
    <p class="sub">Одна и та же фраза, 4 женских голоса модели. Нажми, послушай, скажи какой номер лучше подходит для детской сказки.</p>
    <div id="rows"></div>
    <div class="status" id="status"></div>
  </div>

  <script>
    const TEXT = "Сәлем! Мен — түлкі. Кел, бірге ойнайық!";
    const VOICES = [
      { id: 2, label: "Голос 1" },
      { id: 3, label: "Голос 2" },
      { id: 4, label: "Голос 3" },
      { id: 5, label: "Голос 4" },
    ];
    const rows = document.getElementById("rows");
    const statusEl = document.getElementById("status");
    const audio = new Audio();

    for (const v of VOICES) {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<span class="label">${v.label}</span><button class="btn btn-primary btn-play">▶ Слушать</button>`;
      const btn = row.querySelector("button");
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        statusEl.textContent = `${v.label}: синтез...`;
        try {
          const res = await fetch("/api/speak", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: TEXT, speaker: v.id }),
          });
          if (!res.ok) throw new Error((await res.json()).error || res.statusText);
          const blob = await res.blob();
          audio.src = URL.createObjectURL(blob);
          await audio.play();
          statusEl.textContent = `${v.label}: играет (speaker id ${v.id})`;
        } catch (err) {
          statusEl.textContent = `${v.label}: ошибка — ${err.message}`;
        } finally {
          btn.disabled = false;
        }
      });
      rows.appendChild(row);
    }
  </script>
</body>
</html>
