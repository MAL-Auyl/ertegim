<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { background:#222; padding:20px; }
  .stage {
    position: relative; width: 320px; height: 180px;
    background-image: url(/images/bg-fox.png);
    background-size: cover; background-position: center;
    border-radius: 8px; overflow: hidden;
  }
  video { display: none; }
  canvas {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    height: 90%;
  }
</style>
</head>
<body>
  <div class="stage">
    <video id="v" src="/images/fox_clip2.webm" autoplay loop muted playsinline></video>
    <canvas id="c"></canvas>
  </div>
<script>
const video = document.getElementById('v');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

video.addEventListener('loadedmetadata', () => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
  draw();
});

function draw() {
  if (video.readyState >= 2) {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = frame.data;
    for (let i = 0; i < d.length; i += 4) {
      // near-black -> transparent
      if (d[i] < 28 && d[i+1] < 28 && d[i+2] < 28) {
        d[i+3] = 0;
      }
    }
    ctx.putImageData(frame, 0, 0);
  }
  requestAnimationFrame(draw);
}
</script>
</body></html>
